name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: CodSpeed simulation (${{ matrix.label }})
    # CodSpeed runner v5.2.1 simulation does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: instrumentation
            cache_key: instrument
            package: oxc_coverage_instrument
            bench: instrument
          - label: source maps
            cache_key: source-maps
            package: oxc_coverage_source_maps
            bench: remap
          - label: v8 coverage
            cache_key: v8
            package: oxc_coverage_v8
            bench: apply
          - label: napi remap
            cache_key: napi-remap
            package: oxc_coverage_instrument_napi
            bench: remap
          - label: reports html
            cache_key: reports-html
            package: oxc_coverage_reports
            bench: html
          - label: reports formats
            cache_key: reports-formats
            package: oxc_coverage_reports
            bench: formats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-codspeed@4.7.0

      - name: Build benchmark shard
        env:
          RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"
          PACKAGE: ${{ matrix.package }}
          BENCH: ${{ matrix.bench }}
        run: |
          # Cargo 1.100 puts bench binaries in the build directory, not in
          # target/release/deps. Take the path from the build output.
          exe=$(cargo build --release -p "$PACKAGE" --bench "$BENCH" --features codspeed \
            --message-format=json-render-diagnostics \
            | jq -r --arg bench "$BENCH" 'select(.reason == "compiler-artifact" and .target.name == $bench and .executable != null) | .executable')
          test -n "$exe"
          mkdir -p "target/codspeed/analysis/$PACKAGE"
          mv "$exe" "target/codspeed/analysis/$PACKAGE/"

      - name: Run benchmark shard
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run ${{ matrix.bench }}
