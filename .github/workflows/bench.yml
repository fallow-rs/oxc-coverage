name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: CodSpeed simulation (${{ matrix.label }})
    # CodSpeed runner v5.2.1 simulation does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: instrumentation
            cache_key: instrument
            package: oxc_coverage_instrument
            bench: instrument
          - label: source maps
            cache_key: source-maps
            package: oxc_coverage_source_maps
            bench: remap
          - label: v8 coverage
            cache_key: v8
            package: oxc_coverage_v8
            bench: apply
          - label: napi remap
            cache_key: napi-remap
            package: oxc_coverage_instrument_napi
            bench: remap
          - label: reports html
            cache_key: reports-html
            package: oxc_coverage_reports
            bench: html
          - label: reports formats
            cache_key: reports-formats
            package: oxc_coverage_reports
            bench: formats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed@4.7.0

      - name: Build benchmark shard
        env:
          RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"
        run: |
          cargo build --release -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed
          mkdir -p target/codspeed/analysis/${{ matrix.package }}
          mv target/release/deps/${{ matrix.bench }}-* target/codspeed/analysis/${{ matrix.package }}
          rm target/codspeed/analysis/${{ matrix.package }}/*.d

      - name: Run benchmark shard
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run ${{ matrix.bench }}
