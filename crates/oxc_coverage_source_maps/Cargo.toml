[package]
name = "oxc_coverage_source_maps"
version = "0.8.2"
authors.workspace = true
edition.workspace = true
description = "Istanbul-compatible source-map remap for FileCoverage (port of istanbul-lib-source-maps)"
homepage.workspace = true
include = ["/README.md", "/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[features]
codspeed = ["criterion2/codspeed"]

[lib]
# Inline `#[test]` units live in `tests/`; the lib itself has none, so the
# default `[lib].test = true` would build a harness binary cargo never runs.
test = false

[dependencies]
oxc_coverage_types = { workspace = true }

serde_json = { workspace = true }
srcmap-remapping = { workspace = true }
srcmap-sourcemap = { workspace = true }

[dev-dependencies]
criterion2 = { workspace = true }
srcmap-generator = { workspace = true }

[[bench]]
name = "remap"
harness = false
test = false
required-features = ["codspeed"]
