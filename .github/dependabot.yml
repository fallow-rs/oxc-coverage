version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      oxc:
        patterns: ["oxc_*"]
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /crates/oxc_coverage_instrument_napi
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      napi-toolchain:
        patterns: ["@napi-rs/*"]
      # emnapi, @emnapi/core and @emnapi/runtime must share one version. A
      # bump of one alone breaks every WASM job.
      emnapi:
        patterns: ["emnapi", "@emnapi/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /examples/vitest-typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # vitest and its coverage provider pin each other exactly, so a split
      # pair can never land: each half fails on the other half's old major.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
