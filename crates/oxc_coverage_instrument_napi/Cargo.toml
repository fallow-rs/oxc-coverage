[package]
name = "oxc_coverage_instrument_napi"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
description = "Node.js bindings for oxc-coverage-instrument"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing", "api-bindings"]
publish = false

[lints]
workspace = true

[features]
codspeed = ["criterion2/codspeed"]

[lib]
# `rlib` alongside `cdylib` so `cargo test` can link the platform-agnostic
# helpers without a Node host.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
oxc_coverage_instrument = { workspace = true }
oxc_coverage_report = { workspace = true }
oxc_coverage_reports = { workspace = true }

napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The html reporter writes a directory tree and embeds the syntax-highlighting
# grammars. The WebAssembly binding has to stay under its size ceiling, so only
# the native bindings carry it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
oxc_coverage_reports = { workspace = true, features = ["html"] }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
criterion2 = { workspace = true }
srcmap-generator = { workspace = true }

[[bench]]
name = "remap"
harness = false
test = false
required-features = ["codspeed"]
