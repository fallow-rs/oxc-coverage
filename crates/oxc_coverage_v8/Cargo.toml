[package]
name = "oxc_coverage_v8"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
description = "V8 inspector coverage to Istanbul FileCoverage conversion (port of v8-to-istanbul)"
homepage.workspace = true
include = ["/README.md", "/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing", "web-programming"]

[lints]
workspace = true

[features]
codspeed = ["criterion2/codspeed"]

[lib]
# Inline `#[test]` units live in `tests/`; the lib itself has none, so the
# default `[lib].test = true` would build a harness binary cargo never runs.
test = false

[dependencies]
oxc_coverage_types = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion2 = { workspace = true }

[[bench]]
name = "apply"
harness = false
test = false
required-features = ["codspeed"]
