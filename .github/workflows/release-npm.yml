name: Release npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEBUG: napi:*

jobs:
  release-source:
    name: Verify release source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from main history
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" == refs/heads/main || "$RELEASE_REF" == refs/tags/v* ]]
          git merge-base --is-ancestor HEAD origin/main

  prepublish:
    needs: release-source
    name: Prepublication validation
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 22

      - name: Install trusted-publishing npm
        run: npm install -g --ignore-scripts npm@11.12.1

      - name: Validate release metadata
        run: ./scripts/check.sh version-sync

      - name: Validate exact npm install
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci --ignore-scripts

  build:
    name: Build ${{ matrix.target }}
    needs: prepublish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --release --platform --target aarch64-apple-darwin

          - os: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --release --platform --target x86_64-apple-darwin

          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            build: npx napi build --release --platform --target x86_64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            build: npx napi build --release --platform --target aarch64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            build: npx napi build --release --platform --target x86_64-unknown-linux-musl -x

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --release --platform --target x86_64-pc-windows-msvc

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: npx napi build --release --platform --target aarch64-pc-windows-msvc

          # Hotfix bypass: to ship a native-only emergency release when the
          # WASM build is broken (e.g. an oxc_transformer or napi-rs change
          # that regresses wasm32 compilation), remove this matrix entry
          # AND the "Restore wasm shim files to root package" publish step
          # below. The seven native bindings can be published independently;
          # the wasm shim files in the root package.json `files` field will
          # be absent from the tarball, breaking the browser export only
          # for that one release. Track the wasm regression separately.
          - os: ubuntu-26.04
            target: wasm32-wasip1
            build: npx napi build --release --platform --target wasm32-wasip1

          - os: ubuntu-26.04
            target: wasm32-wasip1-threads
            build: npx napi build --release --platform --target wasm32-wasip1-threads

    steps:
      - name: Configure git long paths (Windows)
        if: contains(matrix.os, 'windows')
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `./.github/actions/setup-rust`, not the dtolnay action directly, so the
      # rust-toolchain.toml channel pin is honored when installing the cross
      # target. Calling dtolnay with `toolchain: stable` installs the target
      # into the `stable` sysroot, while cargo invoked under the repo picks up
      # the channel from rust-toolchain.toml and cannot find the target's
      # `core` crate.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 22

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: contains(matrix.target, 'musl')
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci --ignore-scripts

      - name: Build native binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: ${{ matrix.build }}

      - name: Patch single-threaded WASI artifacts
        if: matrix.target == 'wasm32-wasip1'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-singlethreaded-artifacts.mjs .

      # Inject the SharedArrayBuffer guard into the regenerated browser shim.
      # Only the wasm32-wasip1-threads matrix entry emits the shim; the patch
      # script is a no-op when it is absent, so running it across the whole
      # matrix is safe.
      - name: Patch wasi-browser shim with SharedArrayBuffer guard
        if: matrix.target == 'wasm32-wasip1-threads'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-browser-shim.mjs

      - name: Patch root browser loader
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-browser-loader.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.target }}
          # `napi build` generates the JS/TS wrapper (index.js, index.d.ts) alongside
          # the .node binary. The wrapper embeds the current package.json version and
          # is identical across build targets, so including it here lets the publish
          # job pick one up without running the build again. The wrapper files are
          # gitignored (regenerated on every build) so they must travel via artifacts.
          #
          # The wasm32-wasip1-threads target emits a .wasm binary plus several
          # JS/MJS shims (coverage-instrument.wasi.cjs, coverage-instrument.wasi-browser.js,
          # wasi-worker.mjs, wasi-worker-browser.mjs, browser.js) and the
          # coverage-instrument.wasi.d.cts types that `napi artifacts` requires. upload-artifact
          # evaluates if-no-files-found across the whole artifact, so listing
          # wasm-only globs alongside .node globs is safe (unmatched patterns are
          # silent as long as at least one file is captured).
          path: |
            crates/oxc_coverage_instrument_napi/*.node
            crates/oxc_coverage_instrument_napi/*.wasm
            crates/oxc_coverage_instrument_napi/index.js
            crates/oxc_coverage_instrument_napi/index.d.ts
            crates/oxc_coverage_instrument_napi/browser.js
            crates/oxc_coverage_instrument_napi/coverage-instrument.wasi.cjs
            crates/oxc_coverage_instrument_napi/coverage-instrument.wasi.d.cts
            crates/oxc_coverage_instrument_napi/coverage-instrument.wasi-browser.js
            crates/oxc_coverage_instrument_napi/wasi-worker.mjs
            crates/oxc_coverage_instrument_napi/wasi-worker-browser.mjs
          if-no-files-found: error

  publish-crate:
    environment: release
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the shared setup-rust action so rust-toolchain.toml drives the
      # channel here too (cargo publish is sensitive to channel-level changes
      # in the lock format and crates.io's pre-publish verify build).
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish-crate

      # Before any publish runs: for each publishable crate whose local version
      # is ALREADY on crates.io, diff local src/ against the published .crate.
      # Drift means the crate changed without a version bump, and crates.io
      # will not overwrite the published version. Fail loudly here so the
      # missing bump is fixed instead of the crate silently being skipped.
      - name: Verify no unbumped src drift on published crates
        run: ./scripts/check-version-sync.sh --mode=published

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publish in topological order:
      #   oxc_coverage_types          (no internal deps)
      #   oxc_coverage_source_maps    (depends on types)
      #   oxc_coverage_v8             (depends on types)
      #   oxc_coverage_report         (depends on types)
      #   oxc_coverage_reports        (depends on report, source_maps, types)
      #   oxc_coverage_instrument     (depends on types, source_maps, v8)
      # Each publish skips ONLY when the exact version already exists on the
      # crates.io index (idempotent re-run). Any other failure, notably a
      # verify-build error from a stale companion version pin, fails the job
      # loudly instead of being swallowed by a blanket `|| echo skipping`,
      # which would let crates.io fall behind npm without failing the release.
      - name: Publish oxc_coverage_types
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_types --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_types already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_types publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish oxc_coverage_source_maps
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_source_maps --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_source_maps already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_source_maps publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish oxc_coverage_v8
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_v8 --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_v8 already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_v8 publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish oxc_coverage_report
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_report --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_report already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_report publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish oxc_coverage_reports
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_reports --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_reports already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_reports publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish oxc_coverage_instrument
        run: |
          set +e
          out=$(cargo publish -p oxc_coverage_instrument --allow-dirty --no-verify 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          if echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "::notice::oxc_coverage_instrument already published at this version, skipping"; exit 0
          fi
          echo "::error::oxc_coverage_instrument publish failed (not an already-published skip)"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

  prepare-npm:
    name: Prepare npm tarballs
    runs-on: ubuntu-26.04
    needs: publish-crate
    permissions:
      contents: read
    env:
      TAG_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm
        run: npm install -g --ignore-scripts npm@11.12.1

      - name: Install dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci --ignore-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: crates/oxc_coverage_instrument_napi/artifacts

      - name: Isolate single-threaded wasm artifact
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          mkdir -p artifacts-singlethreaded
          mv artifacts/bindings-wasm32-wasip1 artifacts-singlethreaded/

      - name: Move artifacts into npm dirs
        # `--build-output-dir` tells `napi artifacts` where to find the wasi
        # shim files (coverage-instrument.wasi.cjs, *-browser.js, wasi-worker*.mjs)
        # that `napi build` emits alongside the .wasm binary. Without it,
        # napi-rs looks at the package root and fails ENOENT during the
        # wasm32-wasi npm-dir population step.
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi artifacts --output-dir artifacts --build-output-dir artifacts/bindings-wasm32-wasip1-threads

      - name: Prepare single-threaded WASI npm package
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/prepare-wasi-singlethreaded-package.mjs artifacts-singlethreaded/bindings-wasm32-wasip1

      - name: Validate single-threaded WASI npm package
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/validate-wasi-singlethreaded-package.mjs npm/wasm32-wasi-singlethreaded

      - name: Restore JS/TS wrapper from build artifacts
        # The JS/TS wrapper files (index.js, index.d.ts) are gitignored because
        # `napi build` regenerates them. They ARE in every `bindings-*` artifact
        # produced by the matrix build. Copy one pair back into the napi crate
        # directory so `npm publish` picks them up per the `files` field in package.json.
        # Without this, the tarball ships without index.js and `require('./index.js')`
        # in vitest.js fails at import time.
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          for dir in artifacts/bindings-*/; do
            if [ -f "$dir/index.js" ] && [ -f "$dir/index.d.ts" ]; then
              cp "$dir/index.js" index.js
              cp "$dir/index.d.ts" index.d.ts
              echo "Restored wrapper from $dir"
              break
            fi
          done
          test -f index.js && test -f index.d.ts

      - name: Restore wasm shim files to root package
        # The wasm32-wasi binding emits a browser entry (browser.js) plus four
        # WASI shim files that the root package's `files` field references:
        #   browser.js                          (browser export target)
        #   coverage-instrument.wasi.cjs        (Node WASI loader)
        #   coverage-instrument.wasi-browser.js (browser WASI loader)
        #   wasi-worker.mjs                     (Node worker)
        #   wasi-worker-browser.mjs             (browser worker)
        # `napi artifacts` only places these under `npm/wasm32-wasi/`, not at the
        # root, so without this copy the root tarball ships an `exports` map that
        # references missing files. Source: the bindings-wasm32-wasip1-threads
        # artifact uploaded by the matrix build.
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          src=artifacts/bindings-wasm32-wasip1-threads
          if [ ! -d "$src" ]; then
            echo "::error::$src missing, wasm matrix entry did not produce an artifact"
            exit 1
          fi
          for f in browser.js coverage-instrument.wasi.cjs coverage-instrument.wasi-browser.js wasi-worker.mjs wasi-worker-browser.mjs; do
            if [ ! -f "$src/$f" ]; then
              echo "::error::$src/$f missing, wasm build produced incomplete shim set"
              exit 1
            fi
            cp "$src/$f" "$f"
          done
          echo "Restored wasm shims from $src"

      - name: Patch root browser loader
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-browser-loader.mjs

      - name: Update versions from tag
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          VERSION="${TAG_REF#refs/tags/v}"
          for pkg in package.json npm/*/package.json; do
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg', 'utf8'));
              pkg.version = '$VERSION';
              if (pkg.optionalDependencies) {
                for (const key of Object.keys(pkg.optionalDependencies)) {
                  if (key.startsWith('@oxc-coverage-instrument/')) {
                    pkg.optionalDependencies[key] = '$VERSION';
                  }
                }
              }
              fs.writeFileSync('$pkg', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Prepare root package
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi pre-publish --no-gh-release -t npm --skip-optional-publish

      - name: Restore single-threaded optional dependency
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          VERSION="${TAG_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.optionalDependencies ||= {};
            pkg.optionalDependencies['@oxc-coverage-instrument/binding-wasm32-wasi-singlethreaded'] = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Verify npm pack surfaces
        run: node scripts/npm-pack-surface-check.mjs --require-release-artifacts

      - name: Pack prepared release artifacts without lifecycle scripts
        working-directory: crates/oxc_coverage_instrument_napi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-release"
          for dir in ./npm/*/ .; do
            npm pack "$dir" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-release" |
              jq -er '.[0].filename' >> "$RUNNER_TEMP/npm-release/PUBLISH_ORDER"
          done
          cd "$RUNNER_TEMP/npm-release"
          sha256sum ./*.tgz PUBLISH_ORDER > SHA256SUMS

      - name: Upload prepared npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release-ready
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error

  publish:
    name: Publish prepared npm tarballs
    needs: prepare-npm
    environment: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install pinned publishing tool without lifecycle scripts
        run: npm install --global --ignore-scripts npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-release-ready
          path: tarballs
      - name: Verify and publish prepared tarballs
        shell: bash
        run: |
          set -euo pipefail
          cd tarballs
          sha256sum --check --strict SHA256SUMS
          while IFS= read -r file; do
            [[ "$file" == *.tgz && "$file" != */* ]]
            file="./$file"
            manifest=$(tar -xOf "$file" package/package.json)
            name=$(jq -er .name <<< "$manifest")
            version=$(jq -er .version <<< "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version; already present on npm"
              continue
            fi
            npm publish "$file" --access public --provenance --ignore-scripts
          done < PUBLISH_ORDER
