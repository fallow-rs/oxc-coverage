[package]
name = "oxc_coverage_instrument_cli"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
description = "CLI for Istanbul-compatible coverage instrumentation and reporting, built on Oxc (unofficial)"
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing", "command-line-utilities"]
publish = false

[lints]
workspace = true

[[bin]]
name = "oxc-coverage-instrument"
path = "src/main.rs"
# The bin target's rustdoc output directory (`oxc_coverage_instrument`) collides
# with the library crate of that name. This target is a `main.rs` wrapper with no
# public API, so skip its docs rather than rename the user-facing binary.
doc = false

[dependencies]
oxc_coverage_instrument = { workspace = true }
oxc_coverage_report = { workspace = true }
# `Format::Html` and `html::HtmlOptions` are used unconditionally, so the
# reporter crate's optional `html` feature is a hard requirement here.
oxc_coverage_reports = { workspace = true, features = ["html"] }
oxc_coverage_types = { workspace = true }

serde_json = { workspace = true }
