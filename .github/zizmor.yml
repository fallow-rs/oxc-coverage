rules:
  # crates.io publishing uses CARGO_REGISTRY_TOKEN. Trusted publishing for
  # multi-crate workspaces requires per-crate setup that is not yet configured.
  use-trusted-publishing:
    ignore:
      - release-npm.yml
  # dtolnay/rust-toolchain is the Rust ecosystem standard for CI toolchain
  # management (used in .github/actions/setup-rust/action.yml composite action).
  superfluous-actions:
    ignore:
      - release-npm.yml
  # release-npm.yml separates the matrix `build` job (uses actions/cache) from
  # the privileged `publish` and `publish-crate` jobs, which use neither
  # actions/cache nor downloaded build cache; `cargo publish` and
  # `npm publish` operate on freshly-downloaded artifacts only.
  cache-poisoning:
    ignore:
      - release-npm.yml
  # benchmark-action/github-action-benchmark requires `github-token` in `with:`
  # (it is not env-mappable). Coverage badge push uses GITHUB_TOKEN via the
  # default checkout credentials.
  secrets-outside-env:
    ignore:
      - bloat.yml
      - coverage.yml
      - release-npm.yml
  dangerous-triggers:
    ignore:
      # Calls the org-wide Dependabot workflow in fallow-rs/.github, pinned by
      # SHA. That workflow acts only on same-repository dependabot/** branches
      # and loads its scripts from its own commit.
      - dependabot.yml
  # ci-ok job uses toJSON(needs.*.result), which only contains
  # success/failure/cancelled/skipped tokens; no untrusted user input.
  template-injection:
    ignore:
      - ci.yml
  # release-npm.yml installs exact npm 11.12.1 because the runner-bundled npm
  # does not provide the trusted-publishing behavior required by this release.
  # The exact first-party tool pin is covered by the release contract self-test.
  adhoc-packages:
    ignore:
      - release-npm.yml
      # The vitest-typescript-example matrix installs a TypeScript and
      # @types/node major per leg to prove the example's `>=` devDependency
      # ranges hold across them. Fetching the current release of each major at
      # run time is the point of that job: pinning exact versions would freeze
      # the matrix and stop it testing what consumers actually resolve. Scope is
      # a devDependency inside a private example, never a published artifact.
      - ci.yml
