name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny all permissions by default; grant per-job as needed.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: check-${{ matrix.os }}

      - name: Verification runner self-test
        if: runner.os == 'Linux'
        run: ./scripts/check.sh self-test

      - name: Check experimental AST API
        if: runner.os == 'Linux'
        run: ./scripts/check.sh ast-api

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run doc-tests
        run: cargo test --workspace --doc

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test reports without default features
        if: runner.os == 'Linux'
        run: cargo test -p oxc_coverage_reports --no-default-features --all-targets

      - name: Clippy reports without default features
        if: runner.os == 'Linux'
        run: cargo clippy -p oxc_coverage_reports --no-default-features --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Check for uncommitted changes
        run: git diff --exit-code

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep 'rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv

      - name: Check MSRV
        run: cargo check --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doc

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: ./scripts/check.sh rust-doc

      - name: Check reports documentation without default features
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p oxc_coverage_reports --no-default-features --no-deps --document-private-items

  typos:
    name: Typos
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1

  version-sync:
    name: Version Sync
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Deterministic, no network: every internal version pin must equal the
      # dependency crate's local version, and every publishable crate must be
      # in the release-npm.yml publish-crate job. npm targets, platform
      # manifests, optional dependencies, pack specs, and release targets must
      # also agree before a release.
      - run: ./scripts/check.sh version-sync

  audit:
    name: Security Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - run: ./scripts/check.sh audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  shear:
    name: Unused Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-shear
      - run: ./scripts/check.sh shear

  zizmor:
    name: Actions Security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
      # Pinned rather than floating: an unpinned `uvx zizmor` silently adopts
      # each new release, so a new audit turns main red on a commit that was
      # green locally and in review. scripts/check.sh reads this version back so
      # local runs resolve the same build.
      #
      # Dependabot cannot see this pin (it scans `uses:` and package manifests,
      # not versions inside `run:`), so it will not go stale on its own and will
      # not be bumped for you. Check and move it deliberately:
      #   uv tool run zizmor@latest --version
      # then update the version here; the local check target follows.
      - run: uvx zizmor@1.28.0 --config .github/zizmor.yml --min-confidence medium --format plain .github/

  napi:
    name: Napi Test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: napi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --platform

      - name: Validate V8 inspector coverage
        run: ./scripts/check.sh inspector-smoke

      - name: Install conformance dependencies
        run: npm ci

      - name: Compare V8 branch arm counts with Istanbul
        run: ./scripts/check.sh v8-branch-parity

      - name: Run napi tests
        working-directory: crates/oxc_coverage_instrument_napi
        run: node test.mjs

      - name: Validate production-like emitted behavior
        run: ./scripts/check.sh real-world-output

      - name: Run upstream Istanbul spec subset
        run: ./scripts/check.sh istanbul-upstream

  napi-wasm:
    # Build the napi binding for both WASI variants. The threaded variant runs
    # the full test suite under NAPI_RS_FORCE_WASI=error; the single-threaded
    # variant runs the instrument() smoke.
    # Catches regressions that compile against native libc but not against the
    # wasm32 emulated environment.
    name: Napi Test (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wasm32-wasip1-threads
            target: wasm32-wasip1-threads
          - variant: wasm32-wasip1
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: napi-wasm-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build wasm32-wasi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          rm -f coverage-instrument.wasm32-wasi*.wasm
          npx napi build --release --platform --target ${{ matrix.target }}
          node scripts/patch-wasi-emnapi-plugins.mjs .

      - name: Patch single-threaded WASI artifacts
        if: matrix.target == 'wasm32-wasip1'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-singlethreaded-artifacts.mjs .

      # Inject the SharedArrayBuffer guard into the regenerated browser shim.
      # `napi build` rewrites the shim, so the patch must run after every wasm
      # build that emits it.
      - name: Patch wasi-browser shim with SharedArrayBuffer guard
        if: matrix.target == 'wasm32-wasip1-threads'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-browser-shim.mjs

      - name: Patch root browser loader
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-browser-loader.mjs

      - name: Test browser loader package selection
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm run test:browser-loader

      # The optionalDependency `@oxc-coverage-instrument/binding-wasm32-wasi`
      # is pinned at the previously published version; the loader in
      # `coverage-instrument.wasi.cjs` would silently fall back to that
      # package's wasm whenever the freshly-built local artifact is missing,
      # making the wasi job exercise the published code instead of the PR
      # under test. Remove the published wasm so the loader can only use the
      # freshly-built local artifact; if napi build failed to produce it, the
      # loader fails loudly instead of pretending to test the new code.
      - name: Force loader to use freshly-built local wasm
        run: node scripts/force-local-wasm-artifacts.mjs

      - name: Run threaded napi tests against wasm binding
        if: matrix.target == 'wasm32-wasip1-threads'
        working-directory: crates/oxc_coverage_instrument_napi
        env:
          NAPI_RS_FORCE_WASI: error
        run: npm test

      - name: Run single-threaded instrument smoke
        if: matrix.target == 'wasm32-wasip1'
        env:
          NAPI_RS_FORCE_WASI: error
        run: node scripts/wasm-instrument-smoke.mjs

      - name: Report wasm size and enforce ceiling
        # Each WASM artifact must stay under 2 MB brotli-compressed. The script
        # also reports raw and gzip sizes, but only brotli gates the job.
        run: node scripts/wasm-size-check.mjs crates/oxc_coverage_instrument_napi/coverage-instrument.wasm32-wasi.wasm

  istanbul-diff:
    # The strict profile must match Istanbul exactly. The default profile may
    # differ only through extensions documented in the instrumenter README.
    name: Coverage profile conformance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: istanbul-diff

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install conformance dependencies
        run: npm ci

      - name: Install napi dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --platform

      - name: Compare strict profile with Istanbul
        run: ./scripts/check.sh istanbul-diff-strict | tee istanbul-diff-strict.log

      - name: Check default profile extensions
        run: ./scripts/check.sh istanbul-diff-default | tee istanbul-diff-default.log

      - name: Run compose smoke
        # Eager compose parity with the deferred remap, plus the mapping
        # boundary sweep; fails on any divergence or dangling counter.
        run: node scripts/compose-eager-smoke.mjs

      - name: Upload profile logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-profile-logs
          path: istanbul-diff-*.log
          if-no-files-found: warn

  real-world-parity:
    # Production bundles complement the fixture corpus with large, parser-heavy
    # inputs and real Babel source maps. Preparation is explicit and every cache
    # restore is verified against the checked-in SHA-256 manifest.
    name: Real-world coverage parity
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: real-world-parity

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crates/oxc_coverage_instrument_napi/package-lock.json

      - name: Install conformance dependencies
        run: npm ci

      - name: Install napi dependencies
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci

      - name: Build napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --platform

      - name: Cache pinned real-world corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .bench-tmp/files
          key: real-world-corpus-${{ runner.os }}-${{ hashFiles('scripts/real-world-corpus.json') }}

      - name: Test corpus contract without network
        run: node --test scripts/tests/real-world-corpus.test.mjs

      - name: Prepare and verify pinned corpus
        run: node scripts/prepare-real-world-corpus.mjs

      - name: Run real-world parity gates
        run: ./scripts/check.sh real-world-gates

  vitest-example-binding:
    # Builds the napi binding once for the matrix below. The .node artifact is
    # N-API, so it is ABI-stable across Node majors and the TypeScript version
    # cannot affect it. Building per matrix leg would pay a full release build
    # of oxc four times over for a binary that is bit-identical each time.
    name: Vitest example binding
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: vitest-typescript

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install napi binding deps
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --release --platform

      - name: Upload binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-example-binding
          path: |
            crates/oxc_coverage_instrument_napi/*.node
            crates/oxc_coverage_instrument_napi/index.js
            crates/oxc_coverage_instrument_napi/index.d.ts
          if-no-files-found: error
          retention-days: 1

  vitest-typescript-example:
    # End-to-end smoke for the Vitest TypeScript example: runs vitest with the
    # createOxcInstrumenter adapter on a small TypeScript project with zero
    # pre-transform, then verifies the resulting coverage-final.json is keyed by
    # the .ts source path and statementMap entries point at .ts line numbers.
    #
    # The matrix backs the permissive `>=` devDependency ranges in the example's
    # package.json with something that actually tests them. A plain `npm install`
    # only ever resolves the newest satisfying versions, so without pinning each
    # leg the floor of those ranges would never be exercised. Legs pair a Node
    # major with the matching @types/node major, and cover both the floor
    # (Node 22 / TS 6 / types 22) and the ceiling (Node 24 / TS 7 / types 26).
    name: Vitest TypeScript example (node ${{ matrix.node }}, ts ${{ matrix.ts }})
    needs: vitest-example-binding
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            ts: 6
            types: 22
          - node: 22
            ts: 7
            types: 26
          - node: 24
            ts: 6
            types: 24
          - node: 24
            ts: 7
            types: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-example-binding
          path: crates/oxc_coverage_instrument_napi

      # npm 10.9.8 crashes in arborist ("Cannot read properties of null
      # (reading 'edgesOut')") while resolving peers around the file: binding
      # dependency. --legacy-peer-deps takes the older peer resolver and still
      # resolves the declared ranges fresh, which is what this matrix tests.
      #
      # --legacy-peer-deps also means peer dependencies are never auto-installed,
      # so anything vitest only declares as a peer has to be a real devDependency
      # in the example. vitest 5 moved vite out of its dependencies and left it
      # as a required peer, hence the explicit vite entry in package.json.
      - name: Install example deps
        working-directory: examples/vitest-typescript
        run: npm install --legacy-peer-deps

      # Pin this leg's toolchain. --no-save keeps package.json's declared range
      # intact so the range stays the source of truth and only the resolution
      # under test changes.
      - name: Pin toolchain for this leg
        working-directory: examples/vitest-typescript
        run: npm install --legacy-peer-deps --no-save "typescript@${{ matrix.ts }}" "@types/node@${{ matrix.types }}"

      - name: Report resolved toolchain
        working-directory: examples/vitest-typescript
        run: |
          node -e "console.log('typescript', require('typescript/package.json').version)"
          node -e "console.log('@types/node', require('@types/node/package.json').version)"

      - name: Typecheck example
        working-directory: examples/vitest-typescript
        run: ../../scripts/check.sh vitest-typecheck

      - name: Run vitest with coverage
        working-directory: examples/vitest-typescript
        run: npm run coverage

      - name: Verify coverage targets .ts source
        working-directory: examples/vitest-typescript
        run: npm run verify

  vitest-examples:
    # Runs the React, monorepo, and CI-reports Vitest examples against the
    # binding built from this commit. Each example verifies its own output.
    name: Vitest example (${{ matrix.example }})
    needs: vitest-example-binding
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [vitest-react, vitest-monorepo, vitest-ci-reports, monocart]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-example-binding
          path: crates/oxc_coverage_instrument_napi

      # Same resolver choice as the Vitest TypeScript example job.
      - name: Install example deps
        working-directory: examples/${{ matrix.example }}
        run: npm install --legacy-peer-deps

      - name: Run vitest with coverage
        working-directory: examples/${{ matrix.example }}
        run: npm run coverage

      - name: Write reports
        if: matrix.example == 'vitest-ci-reports'
        working-directory: examples/${{ matrix.example }}
        run: npm run report

      - name: Verify coverage
        working-directory: examples/${{ matrix.example }}
        run: npm run verify

  karma-example:
    # Runs examples/karma in headless Chrome three times: with karma-coverage's
    # default instrumenter, with the oxc-coverage-instrument adapter, and with
    # the adapter in the strict Istanbul profile. Then it compares the
    # coverage-final.json files and runs karma-coverage's preprocessor in Node.
    name: Karma example
    needs: vitest-example-binding
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-example-binding
          path: crates/oxc_coverage_instrument_napi

      # Same as the Workers example: npm install keeps the committed lockfile
      # and still follows a version change of the file: binding.
      - name: Install example deps
        working-directory: examples/karma
        run: npm install

      - name: Run karma and compare coverage
        working-directory: examples/karma
        run: npm run verify

  jest-babel-example:
    # Runs Jest and nyc with mocha on examples/jest-babel, once with
    # oxc-coverage-instrument/babel and once with babel-plugin-istanbul, and
    # compares the coverage-final.json files. It also type-checks the plugin
    # types for ES module and CommonJS consumers.
    name: Jest and nyc Babel example
    needs: vitest-example-binding
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-example-binding
          path: crates/oxc_coverage_instrument_napi

      # The plugin loads test-exclude from the package directory, as in a
      # local checkout.
      - name: Install napi binding deps
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Install example deps
        working-directory: examples/jest-babel
        run: npm ci

      - name: Run Jest and nyc with both plugins
        working-directory: examples/jest-babel
        run: |
          npm run coverage
          npm run coverage:istanbul
          npm run nyc
          npm run nyc:istanbul

      - name: Compare coverage
        working-directory: examples/jest-babel
        run: npm run verify

      - name: Typecheck plugin types
        working-directory: examples/jest-babel
        run: npm run typecheck

  native-vs-wasm-parity:
    # Byte-for-byte parity between the native binding and each WASM variant
    # napi bindings on every conformance fixture. The existing `istanbul-diff`
    # job only runs the native binding; this job catches the case where a
    # future change subtly diverges WASM output from native (e.g. a
    # cfg(target_arch = "wasm32") branch that affects coverage shape).
    name: Native vs WASM parity (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wasm32-wasip1-threads
            target: wasm32-wasip1-threads
          - variant: wasm32-wasip1
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-vs-wasm-parity-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install napi deps
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build native napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --release --platform

      - name: Build wasm32-wasi napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          rm -f coverage-instrument.wasm32-wasi*.wasm
          npx napi build --release --platform --target ${{ matrix.target }}
          node scripts/patch-wasi-emnapi-plugins.mjs .

      - name: Patch single-threaded WASI artifacts
        if: matrix.target == 'wasm32-wasip1'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-singlethreaded-artifacts.mjs .

      - name: Patch wasi-browser shim with SharedArrayBuffer guard
        if: matrix.target == 'wasm32-wasip1-threads'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-browser-shim.mjs

      - name: Patch root browser loader
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-browser-loader.mjs

      # See napi-wasm job for rationale: prevent the wasi loader from falling
      # back to the previously published artifact if the local build is missing.
      - name: Force loader to use freshly-built local wasm
        run: node scripts/force-local-wasm-artifacts.mjs

      - name: Run native-vs-wasm parity
        env:
          OXC_COVERAGE_WASM_VARIANT: ${{ matrix.variant }}
        run: node scripts/native-vs-wasm-parity.mjs

  wasm-node-example:
    # End-to-end smoke for the wasm-node example: builds native plus each WASM
    # variant, then
    # exercises both `npm run smoke` (native-preferred load) and
    # `npm run smoke:wasi` (NAPI_RS_FORCE_WASI=error) against the example's
    # `instrument()` call. Catches regressions where the published smoke
    # scripts drift away from the loader contract.
    name: WASM node example (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wasm32-wasip1-threads
            target: wasm32-wasip1-threads
          - variant: wasm32-wasip1
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wasm-node-example-${{ matrix.target }}
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install napi deps
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build native napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --release --platform

      - name: Build wasm32-wasi napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          rm -f coverage-instrument.wasm32-wasi*.wasm
          npx napi build --release --platform --target ${{ matrix.target }}
          node scripts/patch-wasi-emnapi-plugins.mjs .

      - name: Patch single-threaded WASI artifacts
        if: matrix.target == 'wasm32-wasip1'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-singlethreaded-artifacts.mjs .

      - name: Patch wasi-browser shim with SharedArrayBuffer guard
        if: matrix.target == 'wasm32-wasip1-threads'
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-wasi-browser-shim.mjs

      - name: Patch root browser loader
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/patch-browser-loader.mjs

      - name: Install example deps
        working-directory: examples/wasm-node
        run: npm install

      # The file: dep links examples/wasm-node back to the napi crate directly,
      # but the optionalDependency `@oxc-coverage-instrument/binding-wasm32-wasi`
      # may still be installed into the example's nested node_modules and
      # shadow the freshly-built local wasm. Strip it so the loader has no
      # choice but to use the artifact under test.
      - name: Force loader to use freshly-built local wasm
        run: node scripts/force-local-wasm-artifacts.mjs

      - name: Run smoke (native binding)
        working-directory: examples/wasm-node
        run: npm run smoke

      - name: Run smoke (WASI binding)
        working-directory: examples/wasm-node
        run: npm run smoke:wasi

  cloudflare-workers-example:
    # Secret-free Workers acceptance smoke for the single-threaded wasm target.
    # The job builds the local wasm32-wasip1 artifact, creates a local optional
    # package from that artifact, bundles with Wrangler, then runs the Worker in
    # local workerd and compares its FileCoverage byte-for-byte with native.
    name: Cloudflare Workers example
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cloudflare-workers-example
          targets: wasm32-wasip1,wasm32-wasip1-threads

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install napi deps
        working-directory: crates/oxc_coverage_instrument_napi
        run: npm ci || npm install

      - name: Build native napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: npx napi build --release --platform

      - name: Build threaded wasm32-wasi napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          rm -f coverage-instrument.wasm32-wasi*.wasm
          npx napi build --release --platform --target wasm32-wasip1-threads
          node scripts/patch-wasi-emnapi-plugins.mjs .

      - name: Patch threaded wasi-browser shim
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          node scripts/patch-wasi-browser-shim.mjs
          node scripts/patch-browser-loader.mjs

      - name: Install Workers example deps
        working-directory: examples/cloudflare-workers
        run: npm install

      - name: Prepare local threaded optional package
        run: |
          node scripts/force-local-wasm-artifacts.mjs
          node scripts/prepare-local-wasm-package.mjs \
            --package-name @oxc-coverage-instrument/binding-wasm32-wasi \
            --install-root crates/oxc_coverage_instrument_napi \
            --install-root examples/cloudflare-workers

      - name: Build single-threaded wasm32-wasi napi binding
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          rm -f coverage-instrument.wasm32-wasi*.wasm
          npx napi build --release --platform --target wasm32-wasip1
          node scripts/patch-wasi-emnapi-plugins.mjs .
          node scripts/patch-wasi-singlethreaded-artifacts.mjs .
          node scripts/patch-browser-loader.mjs

      - name: Prepare local single-threaded optional package
        working-directory: crates/oxc_coverage_instrument_napi
        run: |
          node scripts/prepare-wasi-singlethreaded-package.mjs . \
            --install-root . \
            --install-root ../../examples/cloudflare-workers

      - name: Validate local single-threaded optional package
        working-directory: crates/oxc_coverage_instrument_napi
        run: node scripts/validate-wasi-singlethreaded-package.mjs npm/wasm32-wasi-singlethreaded

      - name: Bundle Worker
        working-directory: examples/cloudflare-workers
        run: npm run build

      - name: Smoke Worker against native FileCoverage
        working-directory: examples/cloudflare-workers
        run: npm run smoke

  ci-ok:
    name: CI
    if: always()
    needs:
      - check
      - msrv
      - doc
      - typos
      - version-sync
      - audit
      - deny
      - shear
      - zizmor
      - napi
      - napi-wasm
      - istanbul-diff
      - real-world-parity
      - vitest-example-binding
      - vitest-typescript-example
      - vitest-examples
      - karma-example
      - jest-babel-example
      - native-vs-wasm-parity
      - wasm-node-example
      - cloudflare-workers-example
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          for result in $(echo "$results" | jq -r '.[]'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Job failed with result: $result"
              exit 1
            fi
          done
